[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apk-hub"
version = "4.0.0"
description = "Python/PySide6 port of APK Hub for Android APK, ADB, Samsung Kids and Parental Care operations."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.6",
]

[project.scripts]
apk-hub = "apk_hub.main:main"

[tool.setuptools]
packages = ["apk_hub"]
include-package-data = true

[tool.setuptools.package-data]
apk_hub = [
    "assets/*",
    "assets/images/*",
    "vendor/adb/windows/*",
]
